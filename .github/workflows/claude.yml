name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: imburseag/devops-pipeline-templates/.github/workflows/claude-pr-review.yml@master
    secrets: inherit
    with:
      enableNodeChecks: true
      enableAzureArtifactsNpmAuth: true
